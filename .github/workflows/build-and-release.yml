# Builds the cl384_python_wrapper .pyd from source and publishes a GitHub Release.
#
# Trigger: repository_dispatch (event_type = commlib-tagged) sent by the
# e384commlib trigger workflow, OR manual workflow_dispatch for testing.
#
# Runs on a SELF-HOSTED Windows runner because the build needs vendor SDKs
# (FrontPanel, Cypress FX3) and MSVC 2022 that cannot live on a hosted runner.
# See docs/RUNNER_SETUP.md.
#
# Pipeline:
#   1. Check out this repo (wrapper: main.cpp + CMakeLists.txt).
#   2. Check out e384commlib at the tagged ref, build it from source, install it.
#   3. Build the wrapper against the freshly-installed commlib -> produces the .pyd.
#   4. Assemble the ship bundle (.pyd + runtime DLLs, minus excluded ones).
#   5. Publish a GitHub Release stamped with both versions.

name: Build and release .pyd

on:
  # Sent by e384commlib when an authorised user pushes a tag.
  repository_dispatch:
    types: [commlib-tagged]
  # Manual run for testing. Provide the commlib ref yourself.
  workflow_dispatch:
    inputs:
      commlib_ref:
        description: 'e384commlib git ref (tag/branch) to build from'
        required: true
        default: 'main'

# ---------------------------------------------------------------------------
# Configuration knobs. Most live here so the workflow reads cleanly.
# The seven *_PATH dependency variables are NOT here: they are system
# environment variables on the self-hosted runner (see docs/RUNNER_SETUP.md),
# so the build consumes them exactly as a manual local build does.
# ---------------------------------------------------------------------------
env:
  # Which commlib repo to pull source from.
  COMMLIB_REPO: Elements-SRL/e384commlib
  # Python version this .pyd targets. Matches PYTHON_3_11_7_PATH on the runner.
  # When you add versions later, promote this to a matrix (see docs/ADDING_PYTHON_VERSIONS.md).
  PY_TAG: 'cp311'
  # DLLs to ship alongside the .pyd. okFrontPanel.dll is intentionally omitted
  # (licensing) and main.o is intentionally omitted (build artifact, not runtime).
  # Toggle okFrontPanel back in by adding it here once redistribution is cleared.
  SHIP_DLLS: 'MPSSE.dll FTD2XX.dll'

jobs:
  build:
    runs-on: [self-hosted, windows, e384-build]   # label set defined in RUNNER_SETUP.md
    steps:
      # ----- Resolve which commlib ref we are building --------------------
      - name: Resolve commlib ref
        id: ref
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "repository_dispatch") {
            $r = "${{ github.event.client_payload.commlib_ref }}"
          } else {
            $r = "${{ github.event.inputs.commlib_ref }}"
          }
          if ([string]::IsNullOrWhiteSpace($r)) { throw "No commlib ref provided" }
          echo "commlib_ref=$r" >> $env:GITHUB_OUTPUT
          echo "Building against commlib ref: $r"

      # ----- Check out the wrapper (this repo) ----------------------------
      - name: Checkout wrapper
        uses: actions/checkout@v4
        with:
          path: wrapper

      # ----- Check out commlib source at the tagged ref -------------------
      # Same owner/org, so the default GITHUB_TOKEN can read it. If commlib
      # were private in a different org you'd need a PAT here instead.
      - name: Checkout e384commlib source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.COMMLIB_REPO }}
          ref: ${{ steps.ref.outputs.commlib_ref }}
          path: commlib
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----- Build + install commlib from source --------------------------
      # commlib is a STATIC lib; the wrapper links it, so it must be installed
      # to a prefix the wrapper's find_package() can see. We install into a
      # local folder and hand that folder to the wrapper as E384COMMLIB_PATH.
      #
      # The other commlib deps (FrontPanel, CyAPI, toml++, ftdi_utils) come from
      # the runner's system env vars (FRONT_PANEL_PATH, CY_API_PATH, TOML_PP_PATH,
      # FTDI_UTILS_PATH) — CMake reads them directly, no action needed here.
      - name: Configure commlib
        shell: powershell
        working-directory: commlib
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/commlib-install"

      - name: Build + install commlib
        shell: powershell
        working-directory: commlib
        run: |
          cmake --build build --config Release --target install

      # ----- Build the wrapper -> .pyd ------------------------------------
      # PYTHON_3_11_7_PATH and PYBIND_11_PATH come from the runner's system env.
      # We override E384COMMLIB_PATH to point at what we just installed, so the
      # wrapper links the freshly-built-from-source commlib, not a stale copy.
      - name: Configure wrapper
        shell: powershell
        working-directory: wrapper
        env:
          E384COMMLIB_PATH: ${{ github.workspace }}/commlib-install
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build wrapper
        shell: powershell
        working-directory: wrapper
        env:
          E384COMMLIB_PATH: ${{ github.workspace }}/commlib-install
        run: |
          cmake --build build --config Release

      # ----- Locate the produced .pyd -------------------------------------
      - name: Find .pyd
        id: pyd
        shell: powershell
        working-directory: wrapper
        run: |
          $pyd = Get-ChildItem -Recurse -Filter *.pyd | Select-Object -First 1
          if (-not $pyd) { throw "No .pyd produced — build failed silently" }
          echo "pyd_path=$($pyd.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found: $($pyd.FullName)"

      # ----- Read the commlib version we built against --------------------
      # commlib's CMakeLists declares project(... VERSION x.y.z). We read it
      # straight from the source so the release notes state the true origin.
      - name: Extract commlib version
        id: commlibver
        shell: powershell
        working-directory: commlib
        run: |
          $line = Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
          $ver = $line.Matches[0].Groups[1].Value
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "commlib version: $ver"

      # ----- Assemble the ship bundle -------------------------------------
      # Bundle = the .pyd + the runtime DLLs listed in SHIP_DLLS.
      # The DLLs are pulled from their known locations on the runner. Adjust the
      # source paths in DLL_SEARCH to match where they live on your build machine.
      - name: Assemble bundle
        id: bundle
        shell: powershell
        run: |
          $stage = "${{ github.workspace }}/stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # The .pyd
          Copy-Item "${{ steps.pyd.outputs.pyd_path }}" $stage

          # Runtime DLLs. These folders are where the DLLs sit on the runner;
          # they typically live beside the vendor SDKs pointed to by the env vars.
          $DLL_SEARCH = @(
            "$env:FTDI_UTILS_PATH",
            "$env:FRONT_PANEL_PATH",
            "${{ github.workspace }}/commlib-install/bin"
          )

          foreach ($dll in "${{ env.SHIP_DLLS }}".Split(" ")) {
            $found = $null
            foreach ($dir in $DLL_SEARCH) {
              if ([string]::IsNullOrWhiteSpace($dir)) { continue }
              $hit = Get-ChildItem -Path $dir -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { $found = $hit.FullName; break }
            }
            if (-not $found) { throw "Required DLL not found on runner: $dll" }
            Copy-Item $found $stage
            echo "Bundled: $dll  (from $found)"
          }

          # A manifest so the release is self-documenting.
          $commlibVer = "${{ steps.commlibver.outputs.version }}"
          $wrapperTag = "${{ github.ref_name }}"
          @"
          cl384_python_wrapper build manifest
          -----------------------------------
          Built from e384commlib version : $commlibVer
          commlib ref                    : ${{ steps.ref.outputs.commlib_ref }}
          Python target                  : ${{ env.PY_TAG }} (CPython 3.11, x64)
          Bundled DLLs                   : ${{ env.SHIP_DLLS }}
          NOT included                   : okFrontPanel.dll (see release notes)
          "@ | Out-File -Encoding utf8 "$stage/BUILD_MANIFEST.txt"

          $zip = "${{ github.workspace }}/cl384_python-commlib-$commlibVer-${{ env.PY_TAG }}.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          echo "zip_path=$zip" >> $env:GITHUB_OUTPUT
          echo "release_tag=commlib-$commlibVer" >> $env:GITHUB_OUTPUT

      # ----- Publish the GitHub Release -----------------------------------
      # Release action needs contents:write (granted below). The release is
      # tagged and named to make the originating commlib version obvious.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bundle.outputs.release_tag }}
          name: cl384_python (commlib ${{ steps.commlibver.outputs.version }})
          body: |
            Automated build of the Python wrapper `.pyd`.

            **Originating C++ library:** e384commlib ${{ steps.commlibver.outputs.version }}
            (ref `${{ steps.ref.outputs.commlib_ref }}`)
            **Python target:** CPython 3.11, 64-bit
            **Included:** the `.pyd`, `MPSSE.dll`, `FTD2XX.dll`, a build manifest.

            **Not included:** `okFrontPanel.dll` — required at runtime for Opal
            Kelly devices but omitted here for licensing reasons. Obtain it from
            the EMCR installer / Opal Kelly FrontPanel and place it beside the
            `.pyd`. See the repo README for details.
          files: ${{ steps.bundle.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write   # required for creating the release
